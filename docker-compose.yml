services:
  blackbox:
    build: .
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BLACKBOX_DB: /app/data/traces.db
      BLACKBOX_METRICS: /app/data/metrics.json
      BLACKBOX_MODEL_DIR: /app/data/models
      BLACKBOX_USAGE_DB: /app/data/llm_usage.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      # Mount the local data folder so trained models, metrics and datasets are shared.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:6006:6006"
